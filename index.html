<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>레이싱 게임</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0e1013">
<style>
:root{--bg:#0e1013;--p1:#171a1f;--p2:#1f232a;--line:#2d333d;--y:#ffd21f;--b:#4cb3ff;--g:#3ddc84;--mut:#8b93a1;--ink:#f2f4f7;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:700 15px/1.25 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;overflow:hidden;overscroll-behavior:none;font-variant-numeric:tabular-nums}
.hud b,.ch b,.tab,#shT,.btn,.ico,h3,.sh-h{font-family:'Noto Sans KR',sans-serif;font-weight:800}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.ic{width:1.1em;height:1.1em;vertical-align:-.18em;flex:none}
.hud{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--p1);border-bottom:1px solid var(--line)}
.pill{display:flex;align-items:center;gap:8px;font-size:22px;line-height:1}
.pill .ic{font-size:20px}
.pill b{color:var(--y)}
.pill .ips{margin-left:6px;font:700 13px 'Noto Sans KR',sans-serif;color:var(--mut)}
.pill .ips b{font:700 16px 'Noto Sans KR',sans-serif;color:var(--mut)}
#list{overflow-anchor:none;flex:1;min-height:0;overflow-y:auto;padding:14px 12px 16px;-webkit-overflow-scrolling:touch}
.card{background:var(--p1);border:1px solid var(--line);border-radius:8px;margin-bottom:12px;overflow:hidden}
.ch{display:flex;align-items:center;gap:10px;padding:0 12px 0 0;height:40px;background:var(--p2);border-bottom:1px solid var(--line);font-size:13px}
.ch b{align-self:stretch;display:flex;align-items:center;padding:0 20px 0 14px;background:var(--y);color:#111;font-size:20px;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.ch i.cs{font-style:normal}
.ch span{margin-left:auto;font-size:15px;display:flex;align-items:center;gap:4px}
.ch em{font-style:normal;color:var(--mut);min-width:32px;text-align:right}
.card canvas{display:block;width:100%;height:250px}
.cf{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
.btn{--bg:#3ddc84;--bd:#1f8f52;--fg:#07210f;border:0;border-bottom:4px solid var(--bd);background:var(--bg);color:var(--fg);padding:8px 6px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.15;font-size:18px;cursor:pointer;border-radius:9px;min-height:50px;transition:transform .06s}
.btn:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px}
.btn small{font:700 12px 'Noto Sans KR',sans-serif;display:flex;align-items:center;gap:3px}
.btn.y{--bg:#ffd21f;--bd:#a88700;--fg:#241b00}
.btn.u{--bg:#262b34;--bd:#0d0f12;--fg:#f2f4f7}
.btn:disabled,.btn.y:disabled,.btn.u:disabled{--bg:#22262d;--bd:#16181d;--fg:#667080;cursor:default}
.cf .btn[data-a=buy]:not(:disabled){--bg:#2b7a52;--bd:#1b5238;--fg:#eafff3}
.cf .btn[data-a=merge]:not(:disabled){--bg:#9c8422;--bd:#6e5d15;--fg:#fffbe6}
@keyframes pu{50%{transform:scale(1.04)}}
.cf .btn{height:50px;min-height:0;font-size:16px}
.cf .btn small{font-size:11px}
.cf .btn.u{grid-column:1/-1;height:38px;min-height:0;clip-path:none;flex-direction:row;justify-content:flex-start;gap:10px;padding:0 12px;border:1px solid var(--line);background:var(--bg);border-radius:6px;font-size:14px}
.btn.u{--bg:#1b1f26;--fg:#d6dae1}
.ul{font:800 15px 'Noto Sans KR',sans-serif;white-space:nowrap;flex:none}
.uc{display:flex;flex-wrap:nowrap;gap:10px;flex:1;min-width:0;overflow:hidden;white-space:nowrap;font:700 12px 'Noto Sans KR',sans-serif}
.uc i{font-style:normal;flex:none}
.cost{white-space:nowrap;flex:none}
@media(max-width:400px){.cf .btn.u{gap:6px;padding:0 8px}.ul{font-size:13px}.ul svg{margin-right:3px}.uc{gap:6px;font-size:11px}.cost{font-size:12px;padding:3px 6px}.vd{display:none}}
.vd{width:1px;height:16px;background:#4a5160;flex:none}
.cost{margin-left:auto;font:700 13px 'Noto Sans KR',sans-serif;color:var(--y);background:#000;border:1px solid var(--y);border-radius:6px;padding:3px 9px}
.cf .btn.u:not(:disabled){border-color:#8a7414;--bg:#262c37}
.btn.u:not(:disabled) .ul svg{color:var(--y)}
.btn.u:disabled .cost{background:#2b313b;border-color:#2b313b}
.btn:disabled .cost{color:#667080}
.ul svg{margin-right:5px;vertical-align:-.15em;color:#667080}
.btn:disabled .uc i{opacity:.5}
.dex{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dc{background:var(--p2);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.dc canvas{display:block;width:100%;aspect-ratio:240/140}
.dc div{display:flex;justify-content:space-between;align-items:baseline;padding:6px 10px 8px}
.dc b{font-size:17px}
.dc span{font-size:12px;color:var(--mut)}
.dc.no b{color:#555}
.cy{color:#ffd21f}.cs{color:#4cb3ff}.cg{color:#3ddc84}
.btn.u small.cy,.btn.u small.cs,.btn.u small.cg{opacity:1}
.btn:disabled small.cy,.btn:disabled small.cs,.btn:disabled small.cg{opacity:.55}
.lock{border:1px dashed #3a414d;background:transparent;padding:14px;text-align:center}
.lock .btn{width:100%;font-size:18px;min-height:52px}
.lock p{margin:0 0 10px;color:var(--mut);font-size:13px}
#tabs{display:flex;height:64px;background:var(--p1);border-top:1px solid var(--line);position:relative;z-index:10}
.tab{flex:1;border:0;background:none;color:var(--mut);font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;cursor:pointer}
.tab .ic{font-size:23px}
.tab.on{color:var(--y)}
.tab.on::before{content:"";position:absolute;top:-1px;left:24%;right:24%;height:3px;background:var(--y)}
#sheet{position:absolute;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));height:76%;background:var(--p1);border-top:3px solid var(--y);z-index:9;transform:translateY(105%);transition:transform .25s cubic-bezier(.3,.9,.3,1);display:flex;flex-direction:column;box-shadow:0 -12px 32px rgba(0,0,0,.55)}
#sheet.open{transform:none}
.sh-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 8px;font-size:22px}
.x{width:34px;height:34px;border:1px solid var(--line);background:var(--p2);color:var(--ink);font-size:15px;cursor:pointer;border-radius:6px}
#body{flex:1;overflow-y:auto;padding:4px 14px 16px;-webkit-overflow-scrolling:touch}
.row{display:flex;align-items:center;gap:12px;background:var(--p2);border-left:4px solid var(--y);padding:10px 12px;margin-bottom:8px;border-radius:0 6px 6px 0}
.row.no{opacity:.4;border-left-color:#555}
.ico{width:40px;height:40px;background:#0b0c0f;color:var(--y);display:grid;place-items:center;font-size:20px;border-radius:4px}
.inf{flex:1;display:flex;flex-direction:column;gap:2px;font-size:16px}
.inf span{font-size:12px;color:var(--mut)}
h3{margin:14px 2px 8px;font-size:14px;color:var(--mut);letter-spacing:.04em}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.opt{font:700 14px 'Noto Sans KR',sans-serif;color:var(--ink);background:var(--p2);border:2px solid transparent;border-radius:6px;padding:8px 2px;min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.opt.on{border-color:var(--y)}
.opt small{font-size:11px;color:var(--mut);display:flex;align-items:center;gap:3px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.8)}
p.t{color:var(--mut);font-size:13px;line-height:1.5;margin:2px 4px 12px;text-align:center}
.row.me{border-left-color:var(--g);background:#1f2d27}
.rv{font-size:15px;color:var(--y);white-space:nowrap}
#rkcv{display:block;width:100%;height:284px;border-radius:8px;margin:2px 0 6px}
input.inp{width:100%;background:var(--p2);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:12px;font:700 16px 'Noto Sans KR',sans-serif;user-select:text;-webkit-user-select:text;outline:0}
input.inp:focus{border-color:var(--y)}
.av{width:40px;height:40px;border-radius:6px;flex:none;image-rendering:pixelated;display:grid;place-items:center;color:#fff;font:800 18px 'Noto Sans KR',sans-serif}
.avp{width:96px;height:96px;image-rendering:pixelated;border-radius:8px;border:1px solid var(--line);flex:none}
.row.rk .ico{width:30px;font-size:17px}
.row.rk .inf{min-width:0;word-break:break-all}
.row.rk .rv{font-size:13px}
.acct{display:flex;align-items:center;gap:12px;background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:12px}
.ai{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.ai b{font:800 16px 'Noto Sans KR',sans-serif;color:var(--ink)}
.ai span{font:700 12px/1.4 'Noto Sans KR',sans-serif;color:var(--mut)}
#login{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;background:radial-gradient(120% 60% at 50% 0%,#232a36 0%,#0e1013 70%);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);animation:fadeIn .25s ease-out;overflow-y:auto}
.lgx{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:2}
.lgtop{text-align:center;padding:72px 20px 0}
.lgl{font:800 46px/1.1 'Noto Sans KR',sans-serif;color:var(--y);text-shadow:0 4px 0 #000,0 0 30px rgba(255,210,31,.25)}
.lgs{margin-top:12px;font-size:13px;color:var(--mut)}
#lgcv{display:block;width:100%;height:170px;margin:28px 0 0;flex:none}
.lgbody{margin-top:auto;padding:20px 22px 26px;display:flex;flex-direction:column;gap:12px}
.lgb{height:54px;border:0;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:10px;font:800 17px 'Noto Sans KR',sans-serif;cursor:pointer;transition:transform .06s;flex:none}
.lgb:active:not(:disabled){transform:scale(.98)}
.lgb svg{width:22px;height:22px}
.lgb.gg{background:#fff;color:#1f2329}
.lgb.em{background:#262c37;color:var(--ink);border:1px solid var(--line)}
.lgb.go{background:var(--y);color:#241b00}
.lgb:disabled{opacity:.55;cursor:default}
.lgg{background:none;border:0;color:var(--mut);font:700 14px 'Noto Sans KR',sans-serif;padding:8px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.lgn{margin:2px 0 0;text-align:center;color:#5d6675;font-size:11.5px;line-height:1.6}
.lgerr{min-height:16px;margin:0;text-align:center;color:#ff7b72;font-size:13px}
.lgerr.ok{color:var(--g)}
.lgtabs{display:grid;grid-template-columns:1fr 1fr;background:#1b1f26;border-radius:12px;padding:4px}
.lgtabs button{border:0;background:none;color:var(--mut);font:800 15px 'Noto Sans KR',sans-serif;height:38px;border-radius:9px;cursor:pointer}
.lgtabs button.on{background:#2b313b;color:var(--ink)}
.lglinks{display:flex;justify-content:space-between}
.lglinks button{background:none;border:0;color:var(--mut);font:700 13px 'Noto Sans KR',sans-serif;padding:6px 2px;cursor:pointer}
#dlg{position:absolute;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:rgba(8,9,12,.72);animation:fadeIn .2s ease-out}
#dlgc{width:min(86%,360px);background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:20px 18px 16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 40px rgba(0,0,0,.6);animation:slideIn .25s ease-out}
#dlgc b{font:800 18px 'Noto Sans KR',sans-serif}
#dlgc p{margin:0;color:var(--mut);font-size:13.5px;line-height:1.6;white-space:pre-line}
.dlgb{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.dlgb .btn{min-height:48px;font-size:16px;border-radius:12px}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:120;pointer-events:none}
#toast{position:absolute;left:50%;top:16%;transform:translate(-50%,0);background:rgba(34,39,48,.96);border:1px solid var(--line);border-radius:18px;padding:9px 18px;font-size:14px;line-height:1.4;width:max-content;max-width:88%;text-align:center;pointer-events:none;opacity:0;z-index:95;box-shadow:0 6px 18px rgba(0,0,0,.4)}
#toast.show{animation:tp 2s ease-out}
@keyframes tp{0%{opacity:0;transform:translate(-50%,10px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-8px)}}
.gain{position:absolute;left:66px;top:6px;color:var(--y);font:800 17px 'Noto Sans KR',sans-serif;text-shadow:0 2px 0 #000;pointer-events:none;animation:gup .9s ease-out forwards;z-index:5}
@keyframes gup{0%{opacity:0;transform:translateY(8px)}20%{opacity:1}100%{opacity:0;transform:translateY(-4px)}}
@keyframes rvIn{from{background:rgba(8,9,12,0)}}
@keyframes rvOut{to{background:rgba(8,9,12,0)}}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes raysIn{from{opacity:0;scale:.3}to{opacity:1;scale:1}}
@keyframes raysOut{to{opacity:0;scale:1.3}}
@keyframes tada{0%{transform:scale(0) rotate(-30deg);opacity:0}55%{transform:scale(1.3) rotate(7deg);opacity:1}75%{transform:scale(.92) rotate(-3deg)}100%{transform:scale(1) rotate(0)}}
@keyframes cOut{to{transform:translateY(-26px) scale(.55);opacity:0}}
#off{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(8,9,12,.78);animation:fadeIn .25s ease-out}
#offc{width:min(88%,380px);background:var(--p1);border:1px solid var(--line);border-top:3px solid var(--y);border-radius:8px;padding:14px 14px 16px;text-align:center;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.6);animation:slideIn .3s ease-out}
#offc b{font:800 16px 'Noto Sans KR',sans-serif;color:var(--mut)}
#offc canvas{width:100%;aspect-ratio:560/340;display:block;border-radius:6px;touch-action:manipulation}
#offc .btn{min-height:56px;font-size:21px}
#off.out{animation:fadeOut .3s ease-in forwards}
#off.out #offc{animation:slideOut .3s ease-in forwards}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes slideIn{from{opacity:0;transform:translateY(14px)}}
@keyframes slideOut{to{opacity:0;transform:translateY(10px)}}
.off{display:none!important}
#sheet{border-radius:22px 22px 0 0;background:linear-gradient(180deg,#1d2127,#14171c 50%)}
#sheet::before{content:"";position:absolute;top:7px;left:50%;width:44px;height:4px;margin-left:-22px;border-radius:9px;background:#3b424e}
.sh-h{padding-top:20px}
.sc{background:var(--p1);border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden;animation:sgIn .4s ease-out both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes sgIn{from{opacity:0;transform:translateY(14px)}}
.sch{display:flex;align-items:center;height:40px;background:var(--p2);border-bottom:1px solid var(--line)}
.sch b{align-self:stretch;display:flex;align-items:center;padding:0 22px 0 14px;background:var(--y);color:#111;font:800 18px 'Noto Sans KR',sans-serif;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.scb{padding:14px}
.hero{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.sc .avp{width:84px;height:84px;border:2px solid var(--y);border-radius:10px;background:#0b0c0f;box-shadow:0 4px 0 rgba(0,0,0,.45)}
.hi{display:flex;flex-direction:column;gap:5px;min-width:0}
.hi strong{font:800 21px 'Noto Sans KR',sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hi span{font:700 12px 'Noto Sans KR',sans-serif;color:var(--mut)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.two .btn,.nk .btn,.acb .btn{min-height:44px;font-size:15px}
.nk{display:flex;gap:8px}
.nk .inp{flex:1;min-width:0;background:#12151a}
.nk .btn{min-width:76px}
.sp{height:1px;background:var(--line);margin:14px 0}
.acb .btn{width:100%}
.acb .lgg{display:block;margin:8px auto 0}
.mt{width:46px;height:46px;flex:none;border:1px solid var(--line);border-bottom-width:3px;border-radius:12px;background:var(--p2);color:var(--y);display:grid;place-items:center;cursor:pointer;padding:0;transition:color .2s}
.mt:active{transform:translateY(2px);border-bottom-width:1px}
.mt svg{width:26px;height:26px;overflow:visible}
.mt .wv{transition:opacity .2s}
.mt .sl{stroke-dasharray:23;stroke-dashoffset:23;transition:stroke-dashoffset .22s ease-out}
.mt.mo{color:var(--mut)}
.mt.mo .wv{opacity:0}
.mt.mo .sl{stroke-dashoffset:0}
.vl{font:700 12px 'Noto Sans KR',sans-serif;color:var(--mut);margin:0 0 2px 2px}
.vol.mu input,.vol.mu b{opacity:.4}
.vol{display:flex;align-items:center;gap:12px;transition:opacity .2s}
.vol b{min-width:44px;text-align:right;color:var(--y);font:800 17px 'Noto Sans KR',sans-serif}
input.rg{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:32px;background:none;margin:0;--v:70%;outline:0}
input.rg::-webkit-slider-runnable-track{height:10px;border-radius:99px;background:linear-gradient(90deg,var(--y),var(--y)) 0/var(--v) 100% no-repeat,#0b0c0f;box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}
input.rg::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-8px;border-radius:50%;background:#f2f4f7;border:3px solid var(--y);box-shadow:0 3px 0 rgba(0,0,0,.45)}
input.rg::-moz-range-track{height:10px;border-radius:99px;background:#0b0c0f}
input.rg::-moz-range-progress{height:10px;border-radius:99px;background:var(--y)}
input.rg::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#f2f4f7;border:3px solid var(--y)}
.dis{opacity:.4;pointer-events:none}
</style>
</head>

<script>
// ===== 밸런스 (여기 숫자만 바꾸면 템포가 바뀝니다) =====
const CFG={lap:10,need:3,vMul:3.3,maxLvl:20,drive:.9,bounce:2.2,hitDiv:1.7,slots:6,slotEvery:3/1.4,slotMax:11,baseP:8,pGrow:1.09,lvP:5,trackM:2.5,unlock:350,unlockG:6,upC:30,boostT:3,slowT:2.5,boostX:2.4,upG:2.8,upM:1.09,spdM:1.25,spdEvery:2,off:.2,maxTracks:12};
const TH={
  asphalt:{bg:'#1b1f26',road:'#363c47',edge:'#cfd3da',line:'#fff',skid:'0,0,0'},
  neon:{bg:'#0f0b24',road:'#1b1440',edge:'#5b4de0',line:'#fff',skid:'150,130,255'},
  desert:{bg:'#e8d7b0',road:'#8a6a4a',edge:'#f6ead0',line:'#fff',skid:'40,22,8'},
  ice:{bg:'#e4f1f8',road:'#8fb3cc',edge:'#fff',line:'#fff',skid:'20,40,70'}
};
// 서킷마다 다른 모양 (0~1 정규화 좌표)
const sg=Math.sign,ab=Math.abs,pw=Math.pow,PI2=Math.PI*2;
const SHP=(()=>{
  const SQ=280,MD=220,WD=170,MG=24;
  const wide=f=>({h:WD,g:(W,H)=>{const P=[];for(let k=0;k<160;k++){const q=f(k/160*PI2);P.push([q[0]*W,q[1]*H])}return P}});
  const sqr=f=>({h:SQ,g:(W,H)=>{const P=[];for(let k=0;k<160;k++){const q=f(k/160*PI2);P.push([W/2+(q[0]-.5)*H,q[1]*H])}return P}});
  const pol=(f,k)=>t=>{const r=f(t);return[.5+k*r*Math.cos(t),.5+k*r*Math.sin(t)]};
  const sq=t=>{const c=Math.cos(t),n=Math.sin(t);return[sg(c)*pw(ab(c),.4),sg(n)*pw(ab(n),.4)]};
  // 비율 유지형 틀: 모양을 아무 단위로 만들면 틀(W×h) 안에 여백을 두고 꽉 차게 맞춰줌
  const fit=(P,W,H)=>{let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const p of P){x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])}
    const s=Math.min((W-2*MG)/((x1-x0)||1),(H-2*MG)/((y1-y0)||1)),cx=(x0+x1)/2,cy=(y0+y1)/2;
    return P.map(p=>[W/2+(p[0]-cx)*s,H/2+(p[1]-cy)*s])};
  const fr=(h,mk)=>({h,g:(W,H)=>fit(mk(),W,H)});
  const cv=(n,f)=>{const P=[];for(let k=0;k<n;k++)P.push(f(k/n*PI2));return P};
  // 모서리 둥근 다각형 (오목한 모서리도 OK), 시계 방향
  const rpoly=(V,R)=>{const n=V.length,P=[];
    for(let i=0;i<n;i++){
      const p=V[(i+n-1)%n],v=V[i],q=V[(i+1)%n];
      let ax=p[0]-v[0],ay=p[1]-v[1],bx=q[0]-v[0],by=q[1]-v[1];
      const la=Math.hypot(ax,ay),lb=Math.hypot(bx,by);ax/=la;ay/=la;bx/=lb;by/=lb;
      const th=Math.acos(Math.max(-1,Math.min(1,ax*bx+ay*by))),t=Math.tan(th/2);
      let r=R,d=r/t;const dm=.5*Math.min(la,lb);if(d>dm){d=dm;r=d*t}
      let mx=ax+bx,my=ay+by;const lm=Math.hypot(mx,my);mx/=lm;my/=lm;
      const k=r/Math.sin(th/2),c=[v[0]+mx*k,v[1]+my*k];
      const a1=Math.atan2(v[1]+ay*d-c[1],v[0]+ax*d-c[0]),a2=Math.atan2(v[1]+by*d-c[1],v[0]+bx*d-c[0]);
      let da=a2-a1;while(da>Math.PI)da-=PI2;while(da<-Math.PI)da+=PI2;
      const seg=Math.max(4,Math.ceil(ab(da)*8));
      for(let j=0;j<=seg;j++){const a=a1+da*j/seg;P.push([c[0]+r*Math.cos(a),c[1]+r*Math.sin(a)])}
    }return P};
  const ngon=(n,rot)=>cv(n,t=>[Math.cos(rot+t),Math.sin(rot+t)]);
  // 곡선을 등간격으로 다시 찍고 이동평균으로 뾰족한 곳을 둥글게
  const smooth=(P,w,ps)=>{const n=P.length;const c=[0];for(let k=1;k<=n;k++){const a=P[k-1],b=P[k%n];c.push(c[k-1]+Math.hypot(b[0]-a[0],b[1]-a[1]))}
    const M=240,L=c[n];let Q=[],k=0;for(let j=0;j<M;j++){const tg=j*L/M;while(c[k+1]<tg)k++;const a=P[k],b=P[(k+1)%n],t=(tg-c[k])/((c[k+1]-c[k])||1);Q.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}
    for(let s=0;s<ps;s++){const R=[];for(let j=0;j<M;j++){let x=0,y=0;for(let q=-w;q<=w;q++){const p=Q[(j+q+M)%M];x+=p[0];y+=p[1]}R.push([x/(2*w+1),y/(2*w+1)])}Q=R}return Q};
  // 둥근 덩어리(메타볼): 원 여러 개를 부드럽게 이어 붙인 외곽선
  const blob=(S,T,O)=>{const F=(x,y)=>S.reduce((s,c)=>s+c[2]*c[2]/(((x-c[0])**2+(y-c[1])**2)||1e-9),0);
    return cv(180,t=>{const dx=Math.cos(t),dy=Math.sin(t);let a=0;while(F(O[0]+dx*(a+.02),O[1]+dy*(a+.02))>=T&&a<6)a+=.02;let b=a+.02;for(let i=0;i<24;i++){const m=(a+b)/2;if(F(O[0]+dx*m,O[1]+dy*m)>=T)a=m;else b=m}return[O[0]+dx*a,O[1]+dy*a]})};
  return[
    {h:WD,g:(W,H,rw)=>rrect(W,H,rw,.14,.15)},                                                        // 둥근 직사각 (직사각 틀)
    wide(t=>[.5+.38*Math.cos(t),.5+.28*Math.sin(2*t)]),                                              // 8자(다리)
    sqr(t=>[.5+.412*Math.cos(t),.5+.412*Math.sin(t)]),                                               // 원
    sqr(pol(t=>1+.2*Math.cos(5*t),.3433)),                                                           // 별
    wide(t=>{const c=Math.cos(t),n=Math.sin(t);return[.5+.36*sg(c)*pw(ab(c),.8),.5+.3*sg(n)*pw(ab(n),.8)]}), // 가로 타원
    sqr(pol(t=>1+.2*Math.cos(4*t),.3433)),                                                           // 네잎 클로버
    fr(SQ,()=>cv(160,t=>{const c=Math.cos(t);return[.78*Math.sin(t)*(1-.17*c),-c]})),                // 달걀 (정사각 틀, 세로)
    sqr(pol(t=>1+.3*Math.cos(3*t),.3169)),                                                           // 둥근 삼각
    fr(MD,()=>blob([[-.7,0,.62],[.7,0,.62]],1.4,[0,0])),                                             // 땅콩 (가로로 긴 틀)
    sqr(pol(t=>1+.11*Math.cos(6*t),.371)),                                                           // 톱니
    fr(MD,()=>blob([[-1,.28,.5],[0,0,.58],[1,.28,.5]],1.25,[0,-.1])),                                // 콩 (가로로 긴 틀)
    sqr(t=>{const q=sq(t);return[.5+.3347*(q[0]-q[1])*.7071,.5+.3347*(q[0]+q[1])*.7071]}),           // 마름모
    fr(SQ,()=>smooth(cv(480,t=>[16*pw(Math.sin(t),3),-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))]),10,4)), // 하트
    fr(SQ,()=>rpoly(ngon(3,-Math.PI/2),.2)),                                                         // 삼각형
    fr(250,()=>rpoly(ngon(6,0),.3)),                                                                  // 육각형
    fr(SQ,()=>rpoly(ngon(5,-Math.PI/2),.35)),                                                        // 오각형
    fr(SQ,()=>rpoly([[1,-3.4],[1,-1],[3.4,-1],[3.4,1],[1,1],[1,3.4],[-1,3.4],[-1,1],[-3.4,1],[-3.4,-1],[-1,-1],[-1,-3.4]],.8)), // 십자가
    fr(SQ,()=>smooth(cv(480,t=>[.8*Math.sin(t)*Math.sin(t/2),-Math.cos(t)]),10,4))                    // 물방울
  ];
})();
CFG.maxTracks=SHP.length; // 모양 개수만큼 서킷 확장

// ===== 상태 / 저장 =====
const $=s=>document.querySelector(s);
const fmt=n=>{if(n<10)return String(Math.round(n*10)/10);n=Math.floor(n);if(n<10000)return n.toLocaleString('ko-KR');const u=['','만','억','조','경','해'];let i=0,x=n;while(x>=10000&&i<5){x/=10000;i++}let s=x>=100?x.toFixed(0):x>=10?x.toFixed(1):x.toFixed(2);if(s.includes('.'))s=s.replace(/\.?0+$/,'');return s+u[i]};
const ic=n=>`<svg class="ic"><use href="#i-${n}"/></svg>`;
const newTrack=()=>({cars:[{l:1,u:0}],bought:0,up:0});
const freshS=()=>({money:12,tr:[newTrack()],own:{col:['#ff4d6d','#ffb703'],body:['sedan'],trail:['none'],theme:['asphalt']},sel:{col:'#ff4d6d',body:'sedan',trail:'none',theme:'asphalt'},best:1,t:Date.now(),ips:0,pend:0,uid:'',cloudTs:0,snd:1,vol:.7,bgm:1,bvol:.5});
let S=freshS(),RELOADING=false;
const KEY='circuit-tycoon-v2';
let offMsg='';
try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.tr&&r.tr.length){S=Object.assign(S,r);const dt=Math.min(10800,(Date.now()-r.t)/1000),g=(r.ips||0)*dt*CFG.off;if(g>=1&&dt>30){S.pend=(S.pend||0)+g}}}catch(e){}
S.sel={theme:'asphalt'};
if(!S.nick)S.nick='레이서'+(1000+Math.floor(Math.random()*9000));
function save(){if(RELOADING)return;try{S.t=Date.now();localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

// ===== 경제 =====
const tm=i=>pw(CFG.trackM,i);
const lfOf=i=>R[i]?R[i].lf:1;
const val=(i,l)=>pw(CFG.vMul,l-1)*tm(i)*pw(CFG.upM,S.tr[i].up)*lfOf(i);
const spd=i=>pw(CFG.spdM,Math.floor(S.tr[i].up/CFG.spdEvery));
const ips=i=>S.tr[i].cars.reduce((s,c)=>s+val(i,c.l),0)/(CFG.lap*lfOf(i))*spd(i);
const ipsLive=i=>{const s0=spd(i)/(CFG.lap*lfOf(i));return S.tr[i].cars.reduce((s,c)=>s+val(i,c.l)*Math.max(0,c.v===undefined?s0:c.v),0)};
const slotsOf=(i,up)=>Math.min(CFG.slotMax,CFG.slots+Math.floor((up===undefined?S.tr[i].up:up)/CFG.slotEvery));
const maxL=i=>S.tr[i].cars.reduce((m,c)=>Math.max(m,c.l),1);
const baseL=i=>Math.max(1,maxL(i)-2);
// 낮은 등급이 1~2대만 남아 영원히 못 합치는 일이 없도록, 구매 시 미완성 등급을 먼저 채워줌
function spawnL(i){
  const b=baseL(i),n={};let alt=0;
  S.tr[i].cars.forEach(c=>n[c.l]=(n[c.l]||0)+1);
  for(let l=1;l<b;l++){const k=n[l]||0;if(k===CFG.need-1)return l;if(!alt&&k>0&&k<CFG.need)alt=l}
  return alt||b;
}
const price=i=>Math.ceil(CFG.baseP*pw(CFG.lvP,spawnL(i)-1)*pw(CFG.pGrow,S.tr[i].bought)*tm(i));
const upCost=i=>Math.ceil(CFG.upC*pw(CFG.upG,S.tr[i].up)*tm(i));
const unlockCost=()=>Math.ceil(CFG.unlock*pw(CFG.unlockG,S.tr.length-1));
function mergeL(i){const n={};S.tr[i].cars.forEach(c=>n[c.l]=(n[c.l]||0)+1);for(let l=1;l<CFG.maxLvl;l++)if(n[l]>=CFG.need)return l;return 0}
function gapU(cars){if(!cars.length)return 0;const u=cars.map(c=>c.u).sort((a,b)=>a-b);let bg=-1,at=0;for(let k=0;k<u.length;k++){const nx=k+1<u.length?u[k+1]:u[0]+1,g=nx-u[k];if(g>bg){bg=g;at=u[k]+g/2}}return at%1}

// ===== 서킷 지오메트리 / 렌더 =====
const N=200;let dpr=1,PX=0,PY=0,PA=0;const R=[];
function rrect(W,H,rw,fx,fy){
  const mx=W*(fx||.08),my=H*(fy||.13),R=rw*1.15,x0=mx,x1=W-mx,y0=my,y1=H-my,P=[[x1,H/2]];
  const arc=(cx,cy,a0)=>{for(let k=0;k<=24;k++){const a=a0+k/24*Math.PI/2;P.push([cx+R*Math.cos(a),cy+R*Math.sin(a)])}};
  arc(x1-R,y1-R,0);arc(x0+R,y1-R,Math.PI/2);arc(x0+R,y0+R,Math.PI);arc(x1-R,y0+R,-Math.PI/2);
  return P;
}
function geo(r){
  const W=r.W,H=r.H,n=SHP.length,sh=r.i%n;r.rw=32;
  let P=[];
  P=SHP[sh].g(W,H,r.rw);
  const M=P.length;
  const c=[0];for(let k=1;k<=M;k++){const a=P[k-1],b=P[k%M];c.push(c[k-1]+Math.hypot(b[0]-a[0],b[1]-a[1]))}
  const L=c[M];let k=0;
  for(let j=0;j<N;j++){const tg=j*L/N;while(c[k+1]<tg)k++;const a=P[k],b=P[(k+1)%M],t=(tg-c[k])/((c[k+1]-c[k])||1);r.TX[j]=a[0]+(b[0]-a[0])*t;r.TY[j]=a[1]+(b[1]-a[1])*t}
  for(let j=0;j<N;j++){const n2=(j+1)%N;r.TA[j]=Math.atan2(r.TY[n2]-r.TY[j],r.TX[n2]-r.TX[j])}
  r.L=L;r.lf=Math.min(2,Math.max(.5,L/800));r.bg=null;r.br=null;
  if(sh===1){let j0=-1,j1=-1;for(let j=N>>1;j<N;j++){if(Math.hypot(r.TX[j]-W/2,r.TY[j]-H/2)<r.rw*1.6){if(j0<0)j0=j;j1=j}}if(j0>=0)r.br=[j0/N,j1/N]}
}
function pos(r,u){u-=Math.floor(u);const f=u*N,i=f|0,j=(i+1)%N,t=f-i;PX=r.TX[i]+(r.TX[j]-r.TX[i])*t;PY=r.TY[i]+(r.TY[j]-r.TY[i])*t;{const d=r.TA[j]-r.TA[i];PA=r.TA[i]+(d-Math.round(d/PI2)*PI2)*t}}
function mkBG(r){
  const b=document.createElement('canvas');b.width=Math.round(r.W*dpr);b.height=Math.round(r.H*dpr);
  const g=b.getContext('2d'),th=TH[S.sel.theme];g.scale(dpr,dpr);
  g.fillStyle=th.bg;g.fillRect(0,0,r.W,r.H);

  function elTick(){
    if(st!==3||paused)return;

      c.dir=-1;n.a.currentTime=0;n.f=0;n.dir=1;n.a.play().catch(()=>{});cur=1-cur;

      if(o.dir===1)o.f=Math.min(1,o.f+d);

  }

  function pause(){

  }
  function resume(){
    paused=false;

  }
  return{
    // 사용자 터치 직후(브라우저가 소리 재생을 허용하는 시점)에 호출. 켜져 있고 아직 시작 전이면 시작.
    kick(){if(st!==0||S.bgm===0||document.hidden)return;SND.unlock();load()},
    vol(){
      if(st===2&&out)out.gain.setTargetAtTime(vol(),ac.currentTime,.06);
      else if(st===3)elApply();
    },
    pause,resume
  };
})();

// 화면 최상단 레이어에서 큰 차가 위에서 들어와 -> 스키딩(드리프트 + 연기 + 타이어 자국) -> 새 차가 생길 자리에 작아지며 안착
const FX={cv:null,g:null,run:null,raf:0},FXHIDE=new WeakSet();

const FX_T0=.12,FX_D=1.5,FX_TL=.95;
function fxTarget(run){ // 새 차가 실제로 달리고 있는 현재 위치를 화면 좌표로
  const r=run.r,rc=r.cv.getBoundingClientRect(),ar=$('#app').getBoundingClientRect();
  pos(r,run.car.u);
  const sx=r.W?rc.width/r.W:1,sy=r.H?rc.height/r.H:1;
  return{x:rc.left-ar.left+PX*sx,y:rc.top-ar.top+PY*sy,s:r.rw*.5/16*(1+Math.min(.2,.02*(run.car.l-1)))*sx,a:PA,tx:PX,ty:PY};
}
function fxLand(run,silent){
  if(run.landed)return;run.landed=true;FXHIDE.delete(run.car);
  const tg=fxTarget(run);burst(run.r,tg.tx,tg.ty,'#ffd166',6);
  if(silent)return;
  run.rings.push({x:tg.x,y:tg.y,l:1});
  for(let k=0;k<8;k++){const a=Math.random()*6.3,v=90+Math.random()*120;run.sparks.push({x:tg.x,y:tg.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1})}
}
function fxNewCar(r,car,l){
  if(FX.run){fxLand(FX.run,true);FX.run=null;cancelAnimationFrame(FX.raf)}
  if(!FX.cv){const c=document.createElement('canvas');c.id='fx';$('#app').appendChild(c);FX.cv=c;FX.g=c.getContext('2d')}
  FXHIDE.add(car);
  const W=$('#app').clientWidth,streak=[];
  for(let k=0;k<7;k++)streak.push({x:Math.random()*W,y:-Math.random()*300,len:80+Math.random()*160,v:1400+Math.random()*900});
  FX.run={r,car,l,t0:performance.now(),last:0,landed:false,marks:[],smoke:[],sparks:[],rings:[],streak,pl:null,pr:null};
  SND.reveal(FX_T0,FX_D);
  FX.raf=requestAnimationFrame(fxFrame);
}
function fxFrame(now){
  const run=FX.run;if(!run)return;
  const app=$('#app'),W=app.clientWidth,H=app.clientHeight,cv=FX.cv,g=FX.g;
  if(cv.width!==Math.round(W*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
  const el=(now-run.t0)/1000,dt=run.last?Math.min(.05,(now-run.last)/1000):.016;run.last=now;
  g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,H);
  const p=clamp01((el-FX_T0)/FX_D),tg=fxTarget(run);
  const end=FX_T0+FX_D+FX_TL;
  // 배경 살짝 어둡게
  const dim=.5*sstep(0,.25,el)*(1-sstep(FX_T0+FX_D+.3,end,el));
  g.fillStyle='rgba(6,8,12,'+dim+')';g.fillRect(0,0,W,H);
  // 진입 속도선
  if(el<.9){g.strokeStyle='rgba(255,255,255,'+(.28*(1-el/.9))+')';g.lineWidth=2;g.lineCap='round';g.beginPath();
    run.streak.forEach(s=>{s.y+=s.v*dt;g.moveTo(s.x,s.y-s.len);g.lineTo(s.x,s.y)});g.stroke()}
  // 경로: 위 중앙에서 곧게 내려오다가 목표 쪽으로 미끄러지며 감속
  const tx=clamp01(tg.x/W)*W,ty=Math.max(60,Math.min(H-60,tg.y)),wc=W/2;
  const P0={x:wc,y:-120},P1={x:wc,y:ty*.7},P2={x:lerp(wc,tx,.55),y:ty},P3={x:tx,y:ty};
  const bz=e=>{const u=1-e,a=u*u*u,b=3*u*u*e,c=3*u*e*e,d=e*e*e;return{x:a*P0.x+b*P1.x+c*P2.x+d*P3.x,y:a*P0.y+b*P1.y+c*P2.y+d*P3.y}};
  const ease=q=>1-Math.pow(1-q,2.4);

  if(!run.landed){
    const cs=Math.cos(h),sn=Math.sin(h),rx=px-cs*26*sc,ry=py-sn*26*sc,ox=-sn*11*sc,oy=cs*11*sc;
    const L={x:rx+ox,y:ry+oy},Rr={x:rx-ox,y:ry-oy};
    if(Math.abs(slip)>.18&&p<.97&&p>0){
      if(run.pl&&run.marks.length<240){run.marks.push({a:run.pl.x,b:run.pl.y,c:L.x,d:L.y,l:1,w:Math.max(.8,1.5*sc)});run.marks.push({a:run.pr.x,b:run.pr.y,c:Rr.x,d:Rr.y,l:1,w:Math.max(.8,1.5*sc)})}
      run.pl=L;run.pr=Rr;
      [L,Rr].forEach(q=>{if(run.smoke.length<24&&Math.random()<.28)run.smoke.push({x:q.x,y:q.y,vx:(Math.random()-.5)*40-cs*30,vy:(Math.random()-.5)*40-sn*30,r:4*sc,l:1,s:sc})});

  }
  // 타이어 자국

  run.marks.forEach(m=>{g.strokeStyle='rgba(255,255,255,'+(.06*m.l)+')';g.lineWidth=m.w+1;g.beginPath();g.moveTo(m.a,m.b);g.lineTo(m.c,m.d);g.stroke();
    g.strokeStyle='rgba(8,9,12,'+(.7*m.l)+')';g.lineWidth=m.w;g.beginPath();g.moveTo(m.a,m.b);g.lineTo(m.c,m.d);g.stroke()});
  // 연기
  run.smoke.forEach(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;s.vx*=.96;s.vy*=.96;s.r+=dt*22*s.s;s.l-=dt*1.5});
  run.smoke=run.smoke.filter(s=>s.l>0);
  run.smoke.forEach(s=>{g.fillStyle='rgba(232,236,244,'+(.12*s.l*s.l)+')';g.beginPath();g.arc(s.x,s.y,s.r,0,6.3);g.fill()});
  // 차
  if(!run.landed){
    g.save();g.translate(px,py);
    const gr=g.createRadialGradient(0,0,4,0,0,70*sc);gr.addColorStop(0,'rgba(255,214,102,.2)');gr.addColorStop(1,'rgba(255,214,102,0)');
    g.fillStyle=gr;g.beginPath();g.arc(0,0,70*sc,0,6.3);g.fill();
    g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(4*sc,10*sc,34*sc,14*sc,h,0,6.3);g.fill();
    g.rotate(h);g.scale(sc,sc);drawCar(g,run.l);g.restore();
  }
  if(p>=1&&!run.landed)fxLand(run);
  // 착지 연출: 충격파 + 불꽃
  run.rings.forEach(q=>{q.l-=dt*1.8;const rr=(1-q.l)*90;g.strokeStyle='rgba(255,214,102,'+Math.max(0,q.l)*.5+')';g.lineWidth=1.5+3*q.l;g.beginPath();g.arc(q.x,q.y,rr,0,6.3);g.stroke()});
  run.rings=run.rings.filter(q=>q.l>0);
  run.sparks.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.93;q.vy*=.93;q.l-=dt*2.2;g.fillStyle='rgba(255,226,140,'+Math.max(0,q.l)+')';g.beginPath();g.arc(q.x,q.y,1.2+1.6*q.l,0,6.3);g.fill()});

  // 배너
  const bt=el-(FX_T0+FX_D*.55);
  if(bt>0){

    g.font="800 48px Noto Sans KR,sans-serif";g.lineWidth=8;g.strokeStyle='rgba(40,24,0,.9)';g.strokeText('Lv.'+run.l,0,8);g.fillStyle='#fff';g.fillText('Lv.'+run.l,0,8);
    g.restore();
  }
  if(el>=end){fxLand(run,true);g.clearRect(0,0,W,H);FX.run=null;return}
  FX.raf=requestAnimationFrame(fxFrame);
}

    if(l+1>S.best){S.best=l+1;fxNewCar(r,nc,l+1)} // 새 등급: 화면 위에서 큰 차가 들어와 이 자리로 스키딩 안착

// ===== 랭킹 / 설정 (Firebase 연동은 파일 맨 아래 module 스크립트) =====
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// ===== 프로필 사진: 64x64 / 32색 도트로 변환해서 문서에 문자열로 저장 (Storage 불필요) =====
const AV=64,AVK=32,avC=new Map(),avUrls=new Map();
const avHue=s=>{let h=0;for(const ch of String(s||''))h=(h*31+ch.charCodeAt(0))%360;return h};
function avBox(p){
  const lo=[255,255,255],hi=[0,0,0];
  for(const c of p)for(let k=0;k<3;k++){if(c[k]<lo[k])lo[k]=c[k];if(c[k]>hi[k])hi[k]=c[k]}
  const r=[hi[0]-lo[0],hi[1]-lo[1],hi[2]-lo[2]],ax=r[0]>=r[1]&&r[0]>=r[2]?0:r[1]>=r[2]?1:2;
  return{p,ax,rg:r[ax]};
}
function avQuant(px){ // median cut
  const bx=[avBox(px)];
  while(bx.length<AVK){
    let bi=0;for(let i=1;i<bx.length;i++)if(bx[i].rg*Math.sqrt(bx[i].p.length)>bx[bi].rg*Math.sqrt(bx[bi].p.length))bi=i;
    const b=bx[bi];if(b.rg===0)break;
    b.p.sort((a,c)=>a[b.ax]-c[b.ax]);const m=b.p.length>>1;
    bx.splice(bi,1,avBox(b.p.slice(0,m)),avBox(b.p.slice(m)));
  }
  return bx.map(b=>{const t=[0,0,0];b.p.forEach(c=>{t[0]+=c[0];t[1]+=c[1];t[2]+=c[2]});return t.map(v=>Math.round(v/b.p.length))});
}
function avEncode(pal,idx){
  const by=[pal.length];pal.forEach(c=>by.push(c[0],c[1],c[2]));
  let acc=0,nb=0;
  for(const v of idx){acc=(acc<<5)|v;nb+=5;while(nb>=8){by.push((acc>>(nb-8))&255);nb-=8;acc&=(1<<nb)-1}}
  if(nb)by.push((acc<<(8-nb))&255);

}
function avDecode(str){
  try{
    const b=Array.from(atob(str),c=>c.charCodeAt(0)),n=b[0];if(!n||n>AVK)return null;
    const pal=[];for(let k=0;k<n;k++)pal.push([b[1+k*3],b[2+k*3],b[3+k*3]]);
    const o=new Uint8ClampedArray(AV*AV*4);let pos=1+n*3,acc=0,nb=0;
    for(let i=0;i<AV*AV;i++){
      while(nb<5){acc=(acc<<8)|(b[pos++]||0);nb+=8}
      const v=(acc>>(nb-5))&31;nb-=5;acc&=(1<<nb)-1;
      const c=pal[v]||pal[0];o[i*4]=c[0];o[i*4+1]=c[1];o[i*4+2]=c[2];o[i*4+3]=255;
    }

  }catch(e){return null}
}
function avCanvas(str){

  const d=avDecode(str);let cv=null;
  if(d){cv=document.createElement('canvas');cv.width=cv.height=AV;cv.getContext('2d').putImageData(new ImageData(d,AV,AV),0,0)}
  if(avC.size>120)avC.delete(avC.keys().next().value);
  avC.set(str,cv);return cv;
}
function avHtml(id,nick,str){
  const ac=avCanvas(str);
  if(ac){let u=avUrls.get(str);if(!u){if(avUrls.size>120)avUrls.delete(avUrls.keys().next().value);u=ac.toDataURL();avUrls.set(str,u)}return `<img class="av" src="${u}" alt="">`}
  return `<div class="av" style="background:hsl(${avHue(id)} 40% 34%)">${esc([...String(nick||'?')][0]||'?')}</div>`;
}
async function avFromFile(f){

    const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
    const sw=im.naturalWidth,sh=im.naturalHeight,m=Math.min(sw,sh),sx=(sw-m)/2,sy=(sh-m)/2;
    let size=Math.min(m,512),c=document.createElement('canvas');c.width=c.height=size;
    let g=c.getContext('2d');g.imageSmoothingQuality='high';g.fillStyle='#fff';g.fillRect(0,0,size,size);g.drawImage(im,sx,sy,m,m,0,0,size,size);
    while(size>AV){const ns=Math.max(AV,Math.ceil(size/2)),c2=document.createElement('canvas');c2.width=c2.height=ns;const g2=c2.getContext('2d');g2.imageSmoothingQuality='high';g2.drawImage(c,0,0,ns,ns);c=c2;size=ns}
    const f2=document.createElement('canvas');f2.width=f2.height=AV;const g3=f2.getContext('2d');g3.imageSmoothingQuality='high';g3.drawImage(c,0,0,AV,AV);
    const d=g3.getImageData(0,0,AV,AV).data,px=[];
    for(let i=0;i<AV*AV;i++)px.push([d[i*4],d[i*4+1],d[i*4+2]]);
    const pal=avQuant(px.slice());
    const idx=px.map(c=>{let bi=0,bd=1e9;for(let k=0;k<pal.length;k++){const q=pal[k],e=(c[0]-q[0])**2+(c[1]-q[1])**2+(c[2]-q[2])**2;if(e<bd){bd=e;bi=k}}return bi});
    return avEncode(pal,idx);
  }finally{URL.revokeObjectURL(url)}
}
let rkOff=null;
function mpSend(f){return window.MP?MP.submit({nick:S.nick,score:lvSum(),best:S.best,tracks:S.tr.length,av:S.av||''},f):Promise.resolve(false)}
let rkRaf=0,rkCars=[],rkDir=1.5;
const lvSum=()=>S.tr.reduce((a,t)=>a+t.cars.reduce((b,c)=>b+c.l,0),0);
const RKLN=4,RKL=64,RKP=14,RKH=RKP*2+RKL*RKLN,RKSC=2.7;
const rkLaneY=l=>RKP+RKL*l+RKL/2;
const rkHalf=c=>(CAR[Math.min(c.lv,20)]||CAR[1]).n*RKSC;
// 차선이 비었는지: 다른 차가 그 차선을 노리고 있거나, 아직 그 차선 근처에 있으면 막힌 것
const rkFree=(self,l)=>!rkCars.some(c=>c!==self&&(c.lane===l||Math.abs(c.y-rkLaneY(l))<RKL*.75));
// 서버에서 받은 1~3위를 트랙 위 차량과 맞춰줌 (빠진 차는 뒤로 밀려나고, 새 차는 뒤에서 합류)
function rkSync(rows){
  const top=rows.slice(0,3),me=window.MP&&MP.uid;
  rkCars.forEach(c=>{c.out=!top.some(r=>r.id===c.id)});
  top.forEach(r=>{
    let c=rkCars.find(c=>c.id===r.id);
    if(!c){
      const pref=[1,2,0,3];
      let lane=pref.find(l=>rkFree(null,l));
      if(lane===undefined)lane=pref.find(l=>!rkCars.some(c=>c.lane===l));
      if(lane===undefined)lane=1;
      c={id:r.id,lane,x:-170,y:rkLaneY(lane),a:0,ph:Math.random()*6.3,sg:0,sgT:0,at:0,vx:0,vy:0};rkCars.push(c);
    }
    c.out=false;c.nick=r.nick||'익명';c.lv=Math.max(1,Number(r.best)||1);c.score=Number(r.score)||0;c.me=r.id===me;c.av=r.av||'';
  });
}
function rkStart(cv){
  const g=cv.getContext('2d');
  let W=0,last=0;
  const frame=t=>{
    if(tab!=='rank'||!cv.isConnected)return;
    rkRaf=requestAnimationFrame(frame);
    const dt=last?Math.min(.05,(t-last)/1000):0;last=t;
    const w=cv.clientWidth;if(!w)return;
    if(w!==W){W=w;cv.width=Math.round(W*dpr);cv.height=Math.round(RKH*dpr)}
    const th=TH[S.sel.theme],sec=t/1000,ls=300,y0=RKP,y1=RKH-RKP;
    g.setTransform(dpr,0,0,dpr,0,0);
    // 도로: 차분하게 (연석/차선은 은은한 톤으로만 흘러감)
    g.fillStyle=th.bg;g.fillRect(0,0,W,RKH);
    g.fillStyle=th.road;g.fillRect(0,y0,W,y1-y0);
    const o1=(sec*ls)%48;
    for(let x=-o1-48;x<W;x+=48){
      g.fillStyle='rgba(255,255,255,.16)';g.fillRect(x,y0-7,24,5);g.fillRect(x,y1+2,24,5);
      g.fillStyle='rgba(255,255,255,.05)';g.fillRect(x+24,y0-7,24,5);g.fillRect(x+24,y1+2,24,5);
    }
    const o2=(sec*ls)%64;g.fillStyle='rgba(255,255,255,.24)';
    for(let l=1;l<RKLN;l++)for(let x=-o2-64;x<W;x+=64)g.fillRect(x,y0+RKL*l-1,30,2);
    // 기준 위치 = 점수 차이. 그 주변에서 차선을 바꾸며 서로 추월 시도
    const al=rkCars.filter(c=>!c.out).sort((a,b)=>b.score-a.score),s1=Math.max(1,al.length?al[0].score:1),gm=W*.25;
    al.forEach((c,k)=>c.rank=k+1);
    const baseX=c=>W*.78-Math.min(gm,(s1-c.score)/s1*gm*10);
    rkDir-=dt;
    if(rkDir<=0&&al.length){
      rkDir=1+Math.random()*1.1;
      const adj=c=>[c.lane-1,c.lane+1].filter(l=>l>=0&&l<RKLN&&rkFree(c,l));
      const cand=al.filter(c=>c.rank>1&&!c.at&&adj(c).length);
      if(cand.length&&Math.random()<.8){
        const a=cand[Math.floor(Math.random()*cand.length)],v=al[a.rank-2];
        const ops=adj(a).sort((p,q)=>Math.abs(p-v.lane)-Math.abs(q-v.lane));
        a.lane=ops[0];
        const dx=baseX(v)-baseX(a),close=a.score>=v.score*.9;
        a.sgT=Math.min(W*.3,dx+(close?.5*(rkHalf(a)+rkHalf(v))+16:-rkHalf(a)*.3));a.at=1.5;
      }else{
        const m=al.filter(c=>adj(c).length);
        if(m.length){const c=m[Math.floor(Math.random()*m.length)],o=adj(c);c.lane=o[Math.floor(Math.random()*o.length)]}
      }
    }
    rkCars.forEach(c=>{
      if(c.at>0){c.at-=dt;if(c.at<=0){c.at=0;c.sgT=0}}
      c.sg+=(c.sgT-c.sg)*(1-Math.exp(-dt*2.2));
      const wx=Math.sin(sec*1.1+c.ph)*3,wy=Math.sin(sec*1.5+c.ph*1.3)*1.8;
      let tx=c.out?-230:baseX(c)+c.sg+wx;
      if(!c.out)tx=Math.min(tx,W-rkHalf(c)-10);
      // 임계감쇠 스프링: 출발/멈춤이 부드럽고 튀지 않음
      const wo=c.out?1.8:2.7;c.vx+=(wo*wo*(tx-c.x)-2*wo*c.vx)*dt;c.x+=c.vx*dt;
      c.vy+=(25*(rkLaneY(c.lane)+wy-c.y)-10*c.vy)*dt;c.y+=c.vy*dt;
      c.a+=(Math.atan2(c.vy,380)-c.a)*Math.min(1,dt*9);
    });
    rkCars=rkCars.filter(c=>!(c.out&&c.x<-180));
    // 이름표: 차 바로 뒤에 붙어서 같이 달림
    g.textBaseline='middle';
    rkCars.forEach(c=>{
      if(c.out)return;
      g.font='800 12px Noto Sans KR,sans-serif';const nw=Math.min(84,g.measureText(c.nick).width);
      const lv='Lv.'+fmt(c.score);g.font='700 10px Noto Sans KR,sans-serif';const lw=g.measureText(lv).width;
      const tw=5+24+6+Math.max(nw,lw)+9,tx=c.x-rkHalf(c)-8-tw,ty=c.y;
      g.fillStyle='rgba(10,12,16,.55)';g.beginPath();g.roundRect(tx,ty-17,tw,34,10);g.fill();
      if(c.me){g.strokeStyle='rgba(61,220,132,.7)';g.lineWidth=1;g.stroke()}
      const ac=avCanvas(c.av);g.imageSmoothingEnabled=false;g.textAlign='center';
      if(ac)g.drawImage(ac,tx+5,ty-12,24,24);
      else{g.fillStyle='hsl('+avHue(c.id)+' 40% 34%)';g.fillRect(tx+5,ty-12,24,24);g.fillStyle='#fff';g.font="800 13px 'Noto Sans KR',sans-serif";g.fillText([...c.nick][0]||'?',tx+17,ty+1)}
      g.imageSmoothingEnabled=true;g.textAlign='left';
      g.font='800 12px Noto Sans KR,sans-serif';g.fillStyle=c.me?'#3ddc84':'#fff';g.fillText(c.nick,tx+35,ty-6,84);
      g.font='700 10px Noto Sans KR,sans-serif';g.fillStyle='#ffd21f';g.fillText(lv,tx+35,ty+8);
      g.fillStyle=['#ffd21f','#c9d1dc','#e0894a'][c.rank-1]||'#fff';g.beginPath();g.arc(tx+5,ty-12,7.5,0,6.3);g.fill();
      g.fillStyle='#111';g.font='800 10px Noto Sans KR,sans-serif';g.textAlign='center';g.fillText(String(c.rank),tx+5,ty-11);g.textAlign='left';
    });
    // 차
    rkCars.slice().sort((a,b)=>a.y-b.y).forEach(c=>{
      g.save();g.translate(c.x,c.y);g.rotate(c.a);g.scale(RKSC,RKSC);drawCar(g,c.lv);g.restore();
    });
  };
  rkRaf=requestAnimationFrame(frame);
}

  el.classList.add('out');setTimeout(()=>{el.classList.remove('out');el.classList.add('off')},320);
}
$('#offBtn').onclick=claimOffline;

// ===== 루프 =====
let last=0;
function loop(t){
  requestAnimationFrame(loop);
  if(document.hidden){last=0;return}
  const dt=last?Math.min(.05,(t-last)/1000):0;last=t;
  S.tr.forEach((tr,i)=>{
    const r=R[i],sp=spd(i)/(CFG.lap*r.lf),cs=tr.cars;
    const lap=c=>{const g=val(i,c.l);S.money+=g;gainAcc+=g;if(r.vis){pos(r,c.u);if(r.pops.length<10)r.pops.push({x:PX,y:PY-16,t:'+'+fmt(g),l:1});const vf=viewFrac(r);if(vf>=.03)SND.lap(c.l,r.W?PX/r.W*2-1:0,vf)}};
    const norm=c=>{if(c.u>=1){c.u-=1;if(c.nl)c.nl=0;else lap(c)}else if(c.u<0){c.u+=1;c.nl=1}};
    cs.forEach(c=>{
      if(c.b>0)c.b-=dt;
      c.s=(c.s||0)+((c.b>0?1:0)-(c.s||0))*Math.min(1,dt*4);
      c.wa=(c.wa||0)*Math.exp(-dt*4);c.wt=(c.wt||0)+dt;
      if(c.sn>0)c.sn-=dt;c.sf=(c.sf||1)+((c.sn>0?.45:1)-(c.sf||1))*Math.min(1,dt*5);
      const tg=sp*(1+(CFG.boostX-1)*c.s)*c.sf;
      if(c.v===undefined)c.v=tg;
      c.v+=(tg-c.v)*Math.min(1,dt*CFG.drive);
      c.v=Math.max(-9*sp,Math.min(14*sp,c.v));
      c.u+=c.v*dt;norm(c);
    });
    if(cs.length>1){collideAll(cs,sp,(f,l)=>(chl(r,f)+chl(r,l))*.95/r.L,(m,u)=>trackHit(r,m,u));cs.forEach(norm)}
    cs.forEach(c=>{
      if(c.s>.3&&r.vis){pos(r,c.u);const o=r.rw*.5/16*4.5;
        if(c.px!==undefined&&r.sk.length<260){const x0=-Math.sin(c.pa),y0=Math.cos(c.pa),x1=-Math.sin(PA),y1=Math.cos(PA);for(let q=-1;q<=1;q+=2)r.sk.push({a:c.px+x0*o*q,b:c.py+y0*o*q,c:PX+x1*o*q,d:PY+y1*o*q,l:1})}
        c.px=PX;c.py=PY;c.pa=PA}else c.px=undefined;
    });
    if(r.sk.length){r.sk.forEach(k=>k.l-=dt*.7);while(r.sk.length&&r.sk[0].l<=0)r.sk.shift()}
    for(let k=r.parts.length-1;k>=0;k--){const p=r.parts[k];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.95;p.vy*=.95;p.l-=dt*1.6;if(p.l<=0)r.parts.splice(k,1)}
    for(let k=r.pops.length-1;k>=0;k--){const p=r.pops[k];p.y-=24*dt;p.l-=dt*1.1;if(p.l<=0)r.pops.splice(k,1)}
    if(r.vis&&r.W)drawR(r);
  });
}

// ===== 시작 =====
dpr=Math.min(2,window.devicePixelRatio||1);
S.tr.forEach((_,i)=>addCard(i));renderLock();
new ResizeObserver(()=>R.forEach(sizeR)).observe(list);
ui();setInterval(ui,250);setInterval(save,5000);setInterval(()=>mpSend(),30000);setInterval(()=>{if(!document.hidden)cloudPush()},30000);
addEventListener('visibilitychange',()=>{if(document.hidden){save();cloudPush()}else cloudPull()});
requestAnimationFrame(loop);
if(S.pend>=1)setTimeout(showOffline,500);
</script>
<script type="module">
// ===== Firebase: 로그인 / 클라우드 저장 / 랭킹 =====
const FIREBASE_CONFIG={
  apiKey:"AIzaSyDGCHsfHMT2Sl1VWSI1Hr7zh-Qsyy3ssB4",
  authDomain:"racing-game-80b66.firebaseapp.com",
  projectId:"racing-game-80b66",
  storageBucket:"racing-game-80b66.firebasestorage.app",
  messagingSenderId:"875049732713",
  appId:"1:875049732713:web:712bdea6e4561c71aeb0f8"
};
const V='13.4.0',B='https://www.gstatic.com/firebasejs/'+V+'/';
const MP=window.MP={state:FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.projectId?'connecting':'nocfg',user:null,uid:null,err:'',
  set(s,e){this.state=s;this.err=e||'';dispatchEvent(new Event('mp-state'))}};
let Au=null,Fs=null,auth=null,db=null,lastSent='',lastT=0;
const fail=e=>{throw (e&&e.code)||(e&&e.message)||'unknown'};
// 예전 버전이 남긴 Firebase 익명 세션 정리: 서버에 남은 익명 계정(랭킹/저장 문서 + Auth 계정)을 삭제.
// 게스트 진행은 이 기기(localStorage)에 있으므로 로그인 시 계정으로 옮겨지고, 익명 계정은 필요 없음.
let purging=Promise.resolve();
async function purgeAnon(u){
  for(const c of ['players','saves']){try{await Fs.deleteDoc(Fs.doc(db,c,u.uid))}catch(e){}}
  try{await Au.deleteUser(u)}catch(e){try{await Au.signOut(auth)}catch(_){}}
}
const nickKey=n=>'n_'+encodeURIComponent([...String(n).normalize('NFKC').toLowerCase().replace(/\s+/g,'')].join(''));
MP.login={
  async google(){
    await purging;
    const p=new Au.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
    try{await Au.signInWithPopup(auth,p)}
    catch(e){
      if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'){await Au.signInWithRedirect(auth,p);return}
      fail(e);
    }
  },
  async email(em,pw,signup){await purging;try{await(signup?Au.createUserWithEmailAndPassword(auth,em,pw):Au.signInWithEmailAndPassword(auth,em,pw))}catch(e){fail(e)}},
  async reset(em){try{await Au.sendPasswordResetEmail(auth,em)}catch(e){fail(e)}},
  async out(){try{await Au.signOut(auth)}catch(e){fail(e)}}
};
// 계정별 클라우드 저장 (saves/{uid})
MP.loadSave=async()=>{if(!MP.uid)return null;const s=await Fs.getDoc(Fs.doc(db,'saves',MP.uid));return s.exists()?s.data():null};
MP.putSave=async o=>{if(!MP.uid)throw 'no-user';await Fs.setDoc(Fs.doc(db,'saves',MP.uid),{data:o.data,ts:o.ts,dev:o.dev,t:Fs.serverTimestamp()})};
// 닉네임 중복 방지: nicks/{정규화된 닉네임} = {uid}. 트랜잭션으로 선점하고, 내 이전 닉네임은 해제.
MP.claimNick=async nick=>{
  if(!MP.uid)throw {code:'no-user'};
  const uid=MP.uid,key=nickKey(nick),ref=Fs.doc(db,'nicks',key);
  await Fs.runTransaction(db,async tx=>{
    const s=await tx.get(ref);
    if(s.exists()){if(s.data().uid!==uid)throw {code:'nick-taken'};return}
    tx.set(ref,{uid,nick:String(nick).slice(0,12),t:Fs.serverTimestamp()});
  });
  try{
    const q=await Fs.getDocs(Fs.query(Fs.collection(db,'nicks'),Fs.where('uid','==',uid)));
    await Promise.all(q.docs.filter(d=>d.id!==key).map(d=>Fs.deleteDoc(d.ref)));
  }catch(e){}
};
// ===== 랭킹 =====
// players/{uid}: 점수 등 작은 문서만. 프로필 사진은 avatars/{uid}에 따로 두고, 바뀐 것만 올리고/받음.
const avHash=s=>{if(!s)return '';let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(36)+s.length.toString(36)};
let lastAh=null; // 이 세션에서 서버에 올린 사진 해시 (null = 아직 모름)
MP.submit=async(p,force)=>{
  if(MP.state!=='ok'||!MP.uid)return false;
  const k=JSON.stringify(p),now=Date.now();
  if(!force&&(k===lastSent||now-lastT<30000))return false; // 바뀐 게 있을 때만, 30초 간격으로
  lastT=now;
  const uid=MP.uid,av=typeof p.av==='string'?p.av.slice(0,6000):'';
  let ah=avHash(av),ok=true;
  try{
    if(ah&&ah!==lastAh){
      try{await Fs.setDoc(Fs.doc(db,'avatars',uid),{d:av,h:ah,t:Fs.serverTimestamp()});lastAh=ah}
      catch(e){ah=lastAh||'';ok=false}
    }else if(!ah&&lastAh){
      try{await Fs.deleteDoc(Fs.doc(db,'avatars',uid));lastAh=''}
      catch(e){ah=lastAh;ok=false}
    }
    await Fs.setDoc(Fs.doc(db,'players',uid),{nick:String(p.nick).slice(0,12),score:Math.round(+p.score)||0,best:+p.best||1,tracks:+p.tracks||1,ah,t:Fs.serverTimestamp()});
    lastSent=ok?k:'';MP.err='';return true;
  }catch(e){MP.err=e.code||e.message;return false}
};
// 랭킹 조회: 30초마다 한 번, 결과가 이전과 달라졌을 때만 화면에 알림. 결과는 캐시(탭을 다시 열어도 30초 안이면 재조회 안 함).
const RK={rows:[],sig:'',t:0,av:new Map(),busy:null};
function loadRank(){
  if(RK.busy)return RK.busy;
  RK.busy=(async()=>{
    try{
      await null;
      const s=await Fs.getDocs(Fs.query(Fs.collection(db,'players'),Fs.orderBy('score','desc'),Fs.limit(50)));
      const rows=s.docs.map(d=>{const x=d.data();return{id:d.id,nick:x.nick,score:x.score,best:x.best,tracks:x.tracks,ah:x.ah||'',old:typeof x.av==='string'?x.av:''}});
      const ahOf=new Map(rows.map(r=>[r.id,r.ah]));
      const need=rows.filter(r=>r.ah&&(RK.av.get(r.id)||{}).h!==r.ah).map(r=>r.id); // 사진이 바뀌었거나 처음 보는 사람만
      for(let i=0;i<need.length;i+=30){
        try{
          const q=await Fs.getDocs(Fs.query(Fs.collection(db,'avatars'),Fs.where(Fs.documentId(),'in',need.slice(i,i+30))));
          q.docs.forEach(d=>RK.av.set(d.id,{h:ahOf.get(d.id),d:String(d.data().d||'')}));
        }catch(e){}
      }
      if(RK.av.size>200){const keep=new Set(rows.map(r=>r.id));for(const k of [...RK.av.keys()]){if(RK.av.size<=120)break;if(!keep.has(k))RK.av.delete(k)}}
      rows.forEach(r=>{const a=RK.av.get(r.id);r.av=r.ah?(a?a.d:''):r.old;delete r.old}); // 예전 방식(players.av)도 임시로 표시
      const sig=JSON.stringify(rows.map(r=>[r.id,r.nick,r.score,r.best,r.tracks,r.ah,(r.av||'').length]));
      RK.rows=rows;RK.sig=sig;RK.t=Date.now();
    }finally{RK.busy=null}
  })();
  return RK.busy;
}
MP.watch=(cb,errCb)=>{
  if(MP.state!=='ok')return()=>{};
  let last='',alive=true;
  const emit=()=>{if(alive&&RK.t&&RK.sig!==last){last=RK.sig;cb(RK.rows)}};
  const pull=async force=>{
    if(!alive)return;
    if(!force&&RK.t&&Date.now()-RK.t<28000)return emit();
    try{await loadRank();emit()}
    catch(e){if(RK.t)emit();else errCb&&errCb(e.code||e.message)}
  };
  pull();
  const tm=setInterval(()=>{if(!document.hidden)pull()},30000);
  const stop=()=>{alive=false;clearInterval(tm)};
  stop.refresh=()=>pull(true);
  return stop;
};
// ===== 회원 탈퇴: 서버 데이터(랭킹/사진/저장/닉네임) 삭제 후 계정 삭제. 오래된 로그인이면 먼저 재인증 =====
MP.deleteAccount=async askPw=>{
  const u=auth.currentUser;
  if(!u||u.isAnonymous||u.uid!==MP.uid)throw {code:'no-user'};
  const uid=u.uid,ids=u.providerData.map(x=>x.providerId);
  const recent=Date.now()-Date.parse(u.metadata.lastSignInTime||'')<120000;
  if(!recent){
    try{
      if(ids.includes('google.com')){const gp=new Au.GoogleAuthProvider();gp.setCustomParameters({prompt:'select_account'});await Au.reauthenticateWithPopup(u,gp)}
      else if(ids.includes('password')){
        const pw=await askPw();if(!pw)throw {code:'cancelled'};
        await Au.reauthenticateWithCredential(u,Au.EmailAuthProvider.credential(u.email,pw));
      }
    }catch(e){fail(e)}
  }
  try{
    await Fs.deleteDoc(Fs.doc(db,'players',uid));
    await Fs.deleteDoc(Fs.doc(db,'avatars',uid));
    await Fs.deleteDoc(Fs.doc(db,'saves',uid));
    const q=await Fs.getDocs(Fs.query(Fs.collection(db,'nicks'),Fs.where('uid','==',uid)));
    await Promise.all(q.docs.map(d=>Fs.deleteDoc(d.ref)));
  }catch(e){fail(e)}
  RK.t=0;
  try{await Au.deleteUser(u)}catch(e){fail(e)}
};
if(MP.state==='connecting'){
  (async()=>{
    try{
      let A;[A,Au,Fs]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
      const app=A.initializeApp(FIREBASE_CONFIG);
      auth=Au.getAuth(app);db=Fs.getFirestore(app);
      Au.getRedirectResult(auth).catch(e=>dispatchEvent(new CustomEvent('mp-autherr',{detail:e.code||e.message})));
      Au.onAuthStateChanged(auth,u=>{
        if(u&&u.isAnonymous)purging=purgeAnon(u);
        const r=u&&!u.isAnonymous?u:null;
        MP.user=r?{uid:r.uid,name:r.displayName||r.email||'',email:r.email||''}:null;
        MP.uid=r?r.uid:null;lastSent='';lastAh=null;RK.t=0;
        if(MP.state!=='ok')MP.set('ok');
        dispatchEvent(new Event('mp-auth'));
      },e=>MP.set('err',e.code||e.message));
    }catch(e){MP.set('err',e.code||e.message)}
  })();
}
